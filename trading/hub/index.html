:root{--bg:#f2f4f7;--paper:#fff;--ink:#161b22;--muted:#5b6573;--rule:#d9dee6;--accent:#2457c5;--hot:#d1293d;--chip:#e8edf6;--sans:"IBM Plex Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1318;--paper:#171c23;--ink:#e6eaf0;--muted:#98a2b0;--rule:#2a313b;--accent:#8fb0ff;--hot:#ff7b8a;--chip:#222a35;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1318;--paper:#171c23;--ink:#e6eaf0;--muted:#98a2b0;--rule:#2a313b;--accent:#8fb0ff;--hot:#ff7b8a;--chip:#222a35;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.55}
.wrap{max-width:780px;margin:0 auto;padding-block:20px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
h1{font-size:1.35rem;margin:0}
.sub{color:var(--muted);font-size:.86rem;margin:4px 0 0}
.tools{display:grid;gap:10px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);padding-block:8px;z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;padding:10px 12px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink)}
.search input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.search button{font:inherit;padding:0 14px;border:1px solid var(--rule);border-radius:10px;background:var(--paper);color:var(--ink);cursor:pointer}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{font:inherit;font-size:.86rem;padding:6px 12px;border-radius:99px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.count{font-size:.8rem;color:var(--muted)}
#out{display:grid;gap:22px}
h2{font-size:.82rem;letter-spacing:.06em;color:var(--muted);margin:0 0 8px;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
a.card{display:grid;gap:3px;padding:12px 14px;background:var(--paper);border:1px solid var(--rule);border-radius:10px;text-decoration:none;color:var(--ink);min-width:0}
a.card:focus-visible,a.card:hover{border-color:var(--accent)}
a.card b{font-size:.98rem}
a.card span{font-size:.8rem;color:var(--muted)}
a.card .meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:2px}
a.card .meta em{font-style:normal;font-size:.74rem;padding:1px 7px;border-radius:99px;background:var(--chip);color:var(--muted);font-variant-numeric:tabular-nums}
a.card .meta em.d{color:var(--accent);font-weight:600}
a.card.hot{border-left:4px solid var(--hot)}
.empty{color:var(--muted);padding:20px 0}
.foot{font-size:.78rem;color:var(--muted)}
</style>
<div class="wrap">

  <p class="sub">누르면 바로 열려요. 카드의 파란 날짜 = 석준님이 지시한 날. (2026-11-17 갱신)</p>

    <button id="clear" type="button">지우기</button>

  <div class="tabs" role="group" aria-label="보기 방식">

    <button type="button" data-v="new" aria-pressed="false">최신 지시순</button>
    <button type="button" data-v="date" aria-pressed="false">일자별</button>
    <button type="button" data-v="theme" aria-pressed="false">테마별</button>

  <div class="count" id="count"></div>
</div>

<div id="out"></div>
<p class="foot">새 페이지가 생기면 매니저가 여기에 추가해요. 날짜는 매니저 기록 기준(10월 이전 일부는 만든 날).</p>
</div>

const W="일월화수목금토";
const md=d=>d?(+d.slice(5,7))+"/"+(+d.slice(8,10)):"날짜 없음";
const dayLabel=d=>{if(!d)return "날짜 기록 없음";const x=new Date(d+"T00:00:00");return md(d)+" ("+W[x.getDay()]+")";};
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const byNew=(a,b)=>(b.d||"").localeCompare(a.d||"");

const q=document.getElementById("q"),out=document.getElementById("out"),cnt=document.getElementById("count");
function match(p,k){if(!k)return true;const hay=(p.t+" "+p.s+" "+p.th+" "+md(p.d)+" "+p.d).toLowerCase();return k.toLowerCase().split(/\s+/).every(w=>hay.includes(w));}
function render(){
  const k=q.value.trim();const L=P.filter(p=>match(p,k));
  document.querySelectorAll(".tabs button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===view?"true":"false"));
  let h="";
  if(view==="menu"){h=MENU.map(([m,n])=>block(n,L.filter(p=>p.m===m))).join("");}
  else if(view==="new"){h=block("최신 지시순",[...L].sort(byNew));}
  else if(view==="date"){const ds=[...new Set(L.map(p=>p.d))].sort((a,b)=>(b||"").localeCompare(a||""));h=ds.map(d=>block(dayLabel(d),L.filter(p=>p.d===d))).join("");}
  else {h=THEMES.map(t=>block(t,L.filter(p=>p.th===t).sort(byNew))).join("");}
  out.innerHTML=h||`<p class="empty">"${esc(k)}"(으)로 찾은 페이지가 없어요. 다른 말로 찾아보세요.</p>`;
  cnt.textContent=(k?`찾은 페이지 ${L.length}개`:`전체 ${P.length}개`)+" · 보기: "+({menu:"메뉴",new:"최신 지시순",date:"일자별",theme:"테마별"}[view]);
}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>{view=b.dataset.v;try{localStorage.setItem("hubView",view);}catch(e){}render();}));
q.addEventListener("input",render);
document.getElementById("clear").addEventListener("click",()=>{q.value="";render();q.focus();});
render();
